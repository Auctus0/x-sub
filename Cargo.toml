[package]
name = "x-sub"
version = "0.1.0"
edition = "2021"
description = "Gercek zamanli ekran OCR ve seffaf altyazi ceviri katmani (Windows)"

[dependencies]
eframe = "0.31"
egui = "0.31"
xcap = "0.9"
image = "0.25"
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Globalization",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
ab_glyph = "0.2"
ocrs = "0.13"
